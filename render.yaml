services:
  - type: web
    name: collectflow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build --workspace=@collectflow/api
    startCommand: npx prisma db push --schema=packages/database/prisma/schema.prisma --accept-data-loss && npm run start --workspace=@collectflow/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: collectflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CASHFREE_ENVIRONMENT
        value: sandbox

databases:
  - name: collectflow-db
    plan: free
    region: singapore
    databaseName: collectflow
    user: collectflow_user
