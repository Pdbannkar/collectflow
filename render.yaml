services:
  - type: web
    name: collectflow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build --workspace=@collectflow/api
    startCommand: npm run start --workspace=@collectflow/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://postgres.gviwbmscfmovexwwkquj:CollectFlow_2026_SecureDb%21@aws-1-ap-south-1.pooler.supabase.com:5432/postgres
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CASHFREE_ENVIRONMENT
        value: sandbox
