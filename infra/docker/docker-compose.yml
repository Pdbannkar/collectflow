version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collectflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CollectFlowSecurePass2026}
      POSTGRES_DB: ${POSTGRES_DB:-collectflow_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collectflow_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: collectflow_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CollectFlowSecurePass2026}@postgres:5432/${POSTGRES_DB:-collectflow_prod}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-collectflow_prod_super_secret_jwt_key_minimum_64_characters_long_for_security}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-collectflow_prod_super_secret_refresh_key_minimum_64_characters_long}
      JWT_REFRESH_EXPIRES_IN: 30d
      APP_URL: ${APP_URL:-https://yourdomain.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"

  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    container_name: collectflow_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
